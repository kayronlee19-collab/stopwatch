<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meanwhile Stopwatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Gowun+Batang&family=Noto+Serif+SC:wght@300;400&family=Noto+Sans+KR:wght@300;400&display=swap" rel="stylesheet">
<style>
  /* 해 질 녘에서 밤으로 넘어가는 하늘 */
  :root {
    --night: #140f33;
    --glass: rgba(255, 255, 255, 0.07);
    --glass-strong: rgba(28, 20, 66, 0.55);
    --ink: #fdf6ff;
    --ink-soft: #ddd1f0;
    --muted: #a99ccb;
    --rule: rgba(255, 255, 255, 0.16);
    --rose: #ff8fb1;
    --peach: #ffcf9e;
    --lilac: #c7a6ff;
    --aqua: #8ee8e2;
    --btn-text: #1b1442;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--night);
    color: var(--ink);
    font-family: "Cormorant Garamond", "Gowun Batang", Georgia, serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ── 오로라 하늘 ── */
  .sky {
    position: fixed;
    inset: -20%;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(40% 35% at 20% 20%, rgba(255, 143, 177, 0.55), transparent 70%),
      radial-gradient(35% 30% at 80% 15%, rgba(255, 207, 158, 0.45), transparent 70%),
      radial-gradient(45% 40% at 75% 70%, rgba(142, 232, 226, 0.35), transparent 70%),
      radial-gradient(45% 40% at 15% 80%, rgba(199, 166, 255, 0.5), transparent 70%),
      linear-gradient(180deg, #2a1b5c 0%, #1a1240 45%, #0f0b2a 100%);
    filter: blur(30px) saturate(1.2);
    animation: drift 40s ease-in-out infinite alternate, hue 60s linear infinite;
  }
  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(4%, -3%) scale(1.08); }
    100% { transform: translate(-3%, 4%) scale(1.03); }
  }
  @keyframes hue {
    0%   { filter: blur(30px) saturate(1.2) hue-rotate(0deg); }
    50%  { filter: blur(30px) saturate(1.3) hue-rotate(-35deg); }
    100% { filter: blur(30px) saturate(1.2) hue-rotate(0deg); }
  }
  #globe {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }
  .page {
    position: relative;
    z-index: 2;
    max-width: 600px;
    margin: 0 auto;
    padding: 40px 20px 56px;
  }

  /* ── 마스트헤드 ── */
  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: "Noto Sans KR", sans-serif;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--muted);
    padding-bottom: 10px;
    border-bottom: 1px solid transparent;
    border-image: linear-gradient(90deg, transparent, var(--peach), var(--rose), var(--lilac), transparent) 1;
  }
  .brand {
    text-align: center;
    margin: 30px 0 8px;
    font-family: "Bodoni Moda", serif;
    font-weight: 400;
    font-size: clamp(32px, 9.5vw, 68px);
    letter-spacing: 0.14em;
    padding-left: 0.14em;
    line-height: 1;
    white-space: nowrap;
    background: linear-gradient(90deg, var(--peach), var(--rose), var(--lilac), var(--aqua), var(--peach));
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: flow 14s linear infinite;
  }
  @keyframes flow { to { background-position: 300% 0; } }
  .tagline {
    text-align: center;
    margin: 0;
    font-size: 19px;
    font-style: italic;
    color: var(--ink-soft);
    letter-spacing: 1px;
  }

  /* ── 시간 ── */
  .time-block { margin: 36px 0 0; padding: 30px 0 26px; text-align: center; }
  .label {
    font-family: "Noto Sans KR", sans-serif;
    font-size: 10px;
    letter-spacing: 5px;
    color: var(--peach);
  }
  .time {
    margin: 16px 0 0;
    font-family: "Bodoni Moda", serif;
    font-size: clamp(64px, 21vw, 124px);
    line-height: 1;
    font-variant-numeric: lining-nums tabular-nums;
    filter: drop-shadow(0 0 24px rgba(255, 143, 177, 0.35));
  }
  .time #main {
    background: linear-gradient(100deg, #fff4e6 0%, var(--peach) 25%, var(--rose) 50%, var(--lilac) 75%, #fff4e6 100%);
    background-size: 250% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: flow 10s linear infinite;
  }
  .time .cs {
    font-style: italic;
    font-size: 0.36em;
    color: var(--aqua);
    margin-left: 4px;
    vertical-align: 0.95em;
  }
  .quip {
    display: inline-block;
    min-height: 1.6em;
    margin: 22px auto 0;
    max-width: 440px;
    padding: 8px 20px;
    border-radius: 999px;
    background: var(--glass);
    border: 1px solid var(--rule);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    font-size: 18px;
    font-style: italic;
    color: var(--ink-soft);
    transition: opacity .5s ease;
  }

  /* ── 버튼 ── */
  .controls { display: flex; gap: 12px; margin: 8px 0 0; }
  button {
    flex: 1;
    height: 54px;
    border-radius: 999px;
    font-family: "Noto Sans KR", sans-serif;
    font-size: 13px;
    letter-spacing: 5px;
    cursor: pointer;
    transition: transform .05s, opacity .25s, box-shadow .3s, background .3s;
  }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: .35; cursor: default; }
  #secondary {
    background: var(--glass);
    backdrop-filter: blur(10px);
    color: var(--ink);
    border: 1px solid rgba(255, 255, 255, 0.35);
  }
  #secondary:not(:disabled):hover { background: rgba(255, 255, 255, 0.16); }
  #toggle {
    border: none;
    color: var(--btn-text);
    font-weight: 400;
    background: linear-gradient(110deg, var(--peach), var(--rose), var(--lilac), var(--peach));
    background-size: 300% 100%;
    animation: flow 8s linear infinite;
    box-shadow: 0 10px 30px -10px rgba(255, 143, 177, 0.8);
  }
  #toggle.running {
    background: linear-gradient(110deg, var(--aqua), var(--lilac), var(--rose), var(--aqua));
    background-size: 300% 100%;
    box-shadow: 0 10px 30px -10px rgba(142, 232, 226, 0.8);
  }
  .keys {
    text-align: center;
    margin: 14px 0 0;
    font-family: "Noto Sans KR", sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
  }
  .keys kbd {
    font-family: inherit;
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 1px 6px;
    margin: 0 2px;
    background: var(--glass);
  }

  /* ── 섹션 제목 ── */
  .section-head { display: flex; align-items: baseline; gap: 14px; margin: 54px 0 16px; }
  .section-head .no {
    font-family: "Bodoni Moda", serif;
    font-style: italic;
    font-size: 15px;
    color: var(--peach);
  }
  .section-head h2 { margin: 0; font-weight: 500; font-size: 23px; }
  .section-head .line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--rose), transparent);
    opacity: .6;
  }

  /* ── 숫자 카드 ── */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat {
    --c: var(--peach);
    position: relative;
    overflow: hidden;
    background: var(--glass-strong);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--rule);
    border-radius: 20px;
    padding: 18px 8px 16px;
    text-align: center;
  }
  .stat::before {
    content: "";
    position: absolute;
    inset: -40% -40% auto auto;
    width: 110%;
    height: 110%;
    background: radial-gradient(circle, var(--c), transparent 60%);
    opacity: .22;
    animation: breathe 6s ease-in-out infinite;
  }
  .stat:nth-child(2)::before { animation-delay: -1s; }
  .stat:nth-child(3)::before { animation-delay: -2s; }
  .stat:nth-child(4)::before { animation-delay: -3s; }
  .stat:nth-child(5)::before { animation-delay: -4s; }
  .stat:nth-child(6)::before { animation-delay: -5s; }
  @keyframes breathe { 0%, 100% { transform: scale(1); opacity: .18; } 50% { transform: scale(1.2); opacity: .32; } }
  .stat > * { position: relative; }
  .stat svg {
    width: 22px;
    height: 22px;
    stroke: var(--c);
    fill: none;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 6px var(--c));
  }
  .stat .v {
    margin-top: 8px;
    font-family: "Bodoni Moda", serif;
    font-size: clamp(24px, 6.4vw, 32px);
    line-height: 1.1;
    font-variant-numeric: lining-nums tabular-nums;
    white-space: nowrap;
    color: var(--ink);
  }
  .stat .u { font-family: "Noto Sans KR", sans-serif; font-size: 11px; color: var(--ink-soft); margin-left: 2px; }
  .stat .k { margin-top: 6px; font-family: "Noto Sans KR", sans-serif; font-size: 12px; color: var(--c); letter-spacing: 1px; }
  .stat.alert { border-color: rgba(255, 143, 177, 0.45); }
  .stat.alert .v { color: var(--rose); }
  .stats-note {
    margin: 14px 0 0;
    text-align: center;
    font-size: 16px;
    font-style: italic;
    color: var(--muted);
  }

  /* ── 시적 문장 ── */
  .editorial {
    margin: 44px auto 0;
    padding: 28px 24px 24px;
    max-width: 520px;
    text-align: center;
    border-radius: 24px;
    background: var(--glass);
    border: 1px solid var(--rule);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    font-size: clamp(20px, 5.2vw, 25px);
    font-style: italic;
    line-height: 1.6;
    transition: opacity .9s ease, transform .9s ease, filter .9s ease;
  }
  .editorial::before {
    content: "✧";
    display: block;
    margin-bottom: 8px;
    color: var(--peach);
    font-size: 14px;
    letter-spacing: 8px;
  }
  .editorial.fade { opacity: 0; transform: translateY(8px); filter: blur(4px); }
  .editorial .sig {
    display: block;
    margin-top: 10px;
    font-family: "Bodoni Moda", serif;
    font-style: italic;
    font-size: 13px;
    color: var(--lilac);
  }

  /* ── 랩 ── */
  .laps {
    list-style: none;
    margin: 0;
    padding: 0 16px;
    border-radius: 20px;
    background: var(--glass-strong);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--rule);
  }
  .laps li {
    display: grid;
    grid-template-columns: 44px 1fr auto;
    gap: 4px 12px;
    padding: 15px 0;
    border-bottom: 1px solid var(--rule);
    animation: rise .6s ease;
  }
  .laps li:last-child { border-bottom: none; }
  .laps .idx {
    grid-row: span 2;
    font-family: "Bodoni Moda", serif;
    font-style: italic;
    font-size: 24px;
    line-height: 1;
    background: linear-gradient(135deg, var(--peach), var(--rose));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .laps .caption { font-size: 18px; font-style: italic; }
  .laps .lt {
    font-family: "Bodoni Moda", serif;
    font-size: 20px;
    font-variant-numeric: lining-nums tabular-nums;
    text-align: right;
  }
  .laps .meta { grid-column: 2 / 4; font-family: "Noto Sans KR", sans-serif; font-size: 11px; color: var(--muted); }
  .laps li.best .lt { color: var(--aqua); }
  .laps li.worst .lt { color: var(--rose); }
  .laps .empty { display: block; padding: 22px 0; text-align: center; color: var(--muted); font-size: 17px; font-style: italic; }
  @keyframes rise { from { opacity: 0; transform: translateY(-6px); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }

  footer {
    margin-top: 52px;
    text-align: center;
    font-family: "Noto Sans KR", sans-serif;
    font-size: 10px;
    line-height: 1.8;
    letter-spacing: 1px;
    color: var(--muted);
  }
  footer .mark {
    display: block;
    font-family: "Bodoni Moda", serif;
    font-size: 14px;
    letter-spacing: 6px;
    color: var(--peach);
    margin-bottom: 6px;
  }

  /* ── 언어 전환 버튼 ── */
  .lang {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 3;
    flex: none;
    height: 34px;
    padding: 0 3px;
    display: flex;
    align-items: center;
    gap: 2px;
    border-radius: 999px;
    background: var(--glass-strong);
    border: 1px solid var(--rule);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    font-size: 12px;
    letter-spacing: 1px;
    color: var(--muted);
  }
  .lang span { padding: 5px 11px; border-radius: 999px; transition: background .3s, color .3s; }
  .lang span.on { background: linear-gradient(110deg, var(--peach), var(--rose)); color: var(--btn-text); }
  .page { padding-top: 64px; }

  /* 한국어일 때 글꼴과 크기 */
  html[lang="ko"] body { font-family: "Gowun Batang", "Noto Serif KR", "Batang", serif; }
  html[lang="zh"] body { font-family: "Noto Serif SC", "Songti SC", "SimSun", serif; }
  html[lang="ko"] .tagline, html[lang="zh"] .tagline { font-size: 16px; font-style: normal; }
  html[lang="ko"] .quip, html[lang="zh"] .quip { font-size: 15px; font-style: normal; }
  html[lang="ko"] .section-head h2, html[lang="zh"] .section-head h2 { font-size: 20px; font-weight: 400; }
  html[lang="ko"] .stats-note, html[lang="zh"] .stats-note { font-size: 13px; font-style: normal; }
  html[lang="ko"] .editorial, html[lang="zh"] .editorial { font-size: clamp(17px, 4.6vw, 21px); font-style: normal; line-height: 1.8; }
  html[lang="ko"] .laps .caption, html[lang="zh"] .laps .caption { font-size: 15px; font-style: normal; }
  html[lang="ko"] .laps .empty, html[lang="zh"] .laps .empty { font-size: 14px; font-style: normal; }

  @media (max-width: 420px) {
    .masthead .hide-sm { display: none; }
    .stats { gap: 8px; }
    .stat { padding: 14px 4px 12px; border-radius: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; }
  }
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<canvas id="globe" aria-hidden="true"></canvas>

<button class="lang" id="lang" aria-label="Language / 언어"><span data-l="ko">한국어</span><span data-l="en">EN</span><span data-l="zh">中文</span></button>

<main class="page">
  <div class="masthead">
    <span>VOL. 01</span>
    <span class="hide-sm" data-i18n="sub"></span>
    <span id="today"></span>
  </div>

  <h1 class="brand">MEANWHILE</h1>
  <p class="tagline" data-i18n="tagline"></p>

  <section class="time-block">
    <div class="label" data-i18n="elapsed"></div>
    <div class="time"><span id="main">00:00</span><span class="cs" id="cs">00</span></div>
    <p class="quip" id="quip"></p>
  </section>

  <div class="controls">
    <button id="secondary" disabled></button>
    <button id="toggle"></button>
  </div>
  <p class="keys" data-i18n="keys"></p>

  <div class="section-head">
    <span class="no">No. 01</span>
    <h2 data-i18n="world"></h2>
    <span class="line"></span>
  </div>
  <div class="stats" id="stats"></div>
  <p class="stats-note" data-i18n="note"></p>

  <p class="editorial" id="editorial"></p>

  <div class="section-head">
    <span class="no">No. 02</span>
    <h2 data-i18n="mine"></h2>
    <span class="line"></span>
  </div>
  <ul class="laps" id="laps"></ul>

  <footer>
    <span class="mark">MEANWHILE</span>
    <span data-i18n="footer"></span>
  </footer>
</main>

<script>
/* ═════════════ 데이터 ═════════════ */
const ICONS = {
  baby:   '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 21c0-4 3.1-7 7-7s7 3 7 7"/><path d="M10.5 7.5h.01M13.5 7.5h.01"/></svg>',
  heart:  '<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
  coffee: '<svg viewBox="0 0 24 24"><path d="M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M16 11h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M8 3v3M12 3v3"/></svg>',
  earth:  '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.6 2.5 14.4 0 17M12 3.5c-2.5 2.6-2.5 14.4 0 17"/></svg>',

};

// 1초당 평균 추정치 · 카드마다 고유한 색
const FACTS = [
  { id: 'baby',   rate: 4.3,  color: '#ffcf9e' },
  { id: 'heart',  rate: 1.2,  color: '#ff8fb1' },
  { id: 'coffee', rate: 650,  color: '#f5b78c' },
  { id: 'earth',  rate: 29.8, color: '#8ee8e2' },
  { id: 'tree',   rate: 0.44, color: '#a8e6a1', digits: 1, alert: true },

// 유머 문구가 바뀌는 시점(초)과 랩 캡션 구간(초)
const QUIP_TIMES = [0.01, 10, 60, 180, 215, 300, 420, 900, 1200, 1800, 3600, 7200];
const LAP_LIMITS = [3, 30, 170, 240, 420, 1200, 1800];

/* ═════════════ 한국어 · English ═════════════ */
const I18N = {

    note: '지구본 위 반짝임 하나가 새로 태어난 아기 한 명이에요',

let lang = 'en';
try { lang = localStorage.getItem('meanwhile-lang') || ''; } catch (e) { lang = ''; }
if (!I18N[lang]) {
  const nav = (navigator.language || '').toLowerCase();
  lang = nav.startsWith('ko') ? 'ko' : nav.startsWith('zh') ? 'zh' : 'en';
}
const T = () => I18N[lang];

function lapCaption(sec) {
  const i = LAP_LIMITS.findIndex(x => sec < x);
  return T().laps[i < 0 ? LAP_LIMITS.length : i];
}

/* ═════════════ 숫자 포맷 (만·억 / K·M·B) ═════════════ */
function compact(v, digits = 0) {
  const trim = s => s.replace(/\.0$/, '');
  for (const [min, suffix, div] of T().scale) if (v >= min) return trim((v / div).toFixed(1)) + suffix;
  return v.toLocaleString(T().locale, { minimumFractionDigits: digits, maximumFractionDigits: digits });
}

/* ═════════════ 스탑워치 ═════════════ */
const $ = id => document.getElementById(id);
const mainEl = $('main'), csEl = $('cs'), quipEl = $('quip');
const toggleBtn = $('toggle'), secondaryBtn = $('secondary');
const lapsEl = $('laps'), edEl = $('editorial');

const today = new Date();
$('today').textContent = today.getFullYear() + '.' + String(today.getMonth() + 1).padStart(2, '0') + '.' + String(today.getDate()).padStart(2, '0');

FACTS.forEach(f => {
  const el = document.createElement('div');
  el.className = 'stat' + (f.alert ? ' alert' : '');
  el.style.setProperty('--c', f.color);
  el.innerHTML = ICONS[f.id] +
    '<div class="v"><span>0</span><span class="u"></span></div>' +
    '<div class="k"></div>';
  $('stats').appendChild(el);
  f.el = el.querySelector('.v span');
  f.unitEl = el.querySelector('.u');
  f.labelEl = el.querySelector('.k');
  f.last = '';
});

let running = false, startTime = 0, elapsed = 0, lastLapTotal = 0, laps = [], rafId = null;
let edIndex = 0, edTimer = null, lastQuip = '', birthsShown = 0;

const now = () => running ? elapsed + (performance.now() - startTime) : elapsed;
const pad = n => String(n).padStart(2, '0');
function fmt(ms) {
  const h = Math.floor(ms / 3600000), m = Math.floor(ms / 60000) % 60, s = Math.floor(ms / 1000) % 60;
  return (h ? h + ':' : '') + pad(m) + ':' + pad(s);
}
const fmtFull = ms => fmt(ms) + '.' + pad(Math.floor(ms / 10) % 100);

function setQuip(text) {
  if (text === lastQuip) return;
  lastQuip = text;
  quipEl.style.opacity = 0;
  setTimeout(() => { quipEl.textContent = text; quipEl.style.opacity = 1; }, 250);
}

function render() {
  const t = now(), sec = t / 1000;
  mainEl.textContent = fmt(t);
  csEl.textContent = pad(Math.floor(t / 10) % 100);

  for (const f of FACTS) {
    const raw = sec * f.rate;
    const txt = compact(f.digits ? raw : Math.floor(raw), f.digits || 0);
    if (txt !== f.last) { f.el.textContent = txt; f.last = txt; }
  }

  const births = Math.floor(sec * 4.3);
  while (birthsShown < births) { Globe.birth(); birthsShown++; }
  if (births < birthsShown) birthsShown = births;

  let q = T().idle;
  if (t > 0) {
    q = T().quips[0];
    QUIP_TIMES.forEach((th, i) => { if (sec >= th) q = T().quips[i]; });
  }
  setQuip(q);

  if (running) rafId = requestAnimationFrame(render);
}

function rotateEditorial() {
  edEl.classList.add('fade');
  setTimeout(() => {
    edIndex = (edIndex + 1) % T().editorials.length;
    showEditorial();
    edEl.classList.remove('fade');
  }, 900);
}

function showEditorial() {
  edEl.innerHTML = T().editorials[edIndex] + '<span class="sig">— Meanwhile</span>';
}

function renderLaps() {
  if (!laps.length) {
    lapsEl.innerHTML = '<li class="empty">' + T().empty + '</li>';
    return;
  }
  let best = -1, worst = -1;
  if (laps.length >= 2) {
    const v = laps.map(l => l.lap);
    best = v.indexOf(Math.min(...v));
    worst = v.indexOf(Math.max(...v));
  }
  lapsEl.innerHTML = '';
  for (let i = laps.length - 1; i >= 0; i--) {
    const L = laps[i], s = L.lap / 1000;
    const li = document.createElement('li');
    if (i === best) li.className = 'best';
    if (i === worst) li.className = 'worst';
    li.innerHTML =
      '<span class="idx">' + pad(i + 1) + '</span>' +
      '<span class="caption">' + lapCaption(s) + '</span>' +
      '<span class="lt">' + fmtFull(L.lap) + '</span>' +
      '<span class="meta">' + T().meta(compact(Math.floor(s * 4.3)), compact(Math.floor(s * 650))) + '</span>';
    lapsEl.appendChild(li);
  }
}

function updateButtons() {
  toggleBtn.textContent = running ? T().stop : (elapsed > 0 ? T().resume : T().start);
  toggleBtn.classList.toggle('running', running);
  secondaryBtn.textContent = (!running && elapsed > 0) ? T().reset : T().lap;
  secondaryBtn.disabled = !running && elapsed === 0;
}

function toggle() {
  if (running) {
    elapsed += performance.now() - startTime;
    running = false;
    cancelAnimationFrame(rafId);
    clearInterval(edTimer);
    render();
  } else {
    startTime = performance.now();
    running = true;
    render();
    edTimer = setInterval(rotateEditorial, 12000);
  }
  updateButtons();
}

function lap() {
  if (!running) return;
  const total = now();
  laps.push({ lap: total - lastLapTotal, total });
  lastLapTotal = total;
  renderLaps();
}

function reset() {
  if (running) return;
  elapsed = 0; lastLapTotal = 0; laps = []; birthsShown = 0;
  render(); renderLaps(); updateButtons();
}

toggleBtn.addEventListener('click', toggle);
secondaryBtn.addEventListener('click', () => running ? lap() : reset());
document.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key === 'l' || e.key === 'L') lap();
  else if (e.key === 'r' || e.key === 'R') reset();
});

/* ═════════════ 지구촌 배경 애니메이션 ═════════════
   별빛 속에 떠 있는 지구 · 무지갯빛 항로 · 꽃처럼 피어나는 탄생 */
const Globe = (() => {
  const canvas = $('globe');
  const ctx = canvas.getContext('2d');
  const DEG = Math.PI / 180;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const HUES = [28, 345, 270, 175, 45, 310];   // 복숭아 · 장미 · 라일락 · 물빛 · 금빛 · 자홍
  const hsl = (h, s, l, a) => `hsla(${h},${s}%,${l}%,${a})`;
  const randHue = () => HUES[(Math.random() * HUES.length) | 0];

  const CITIES = [
    ['Seoul', 37.57, 126.98], ['Tokyo', 35.68, 139.69], ['Beijing', 39.9, 116.4], ['Shanghai', 31.23, 121.47],
    ['Hong Kong', 22.3, 114.17], ['Singapore', 1.35, 103.82], ['Bangkok', 13.75, 100.5], ['Mumbai', 19.08, 72.88],
    ['Delhi', 28.61, 77.21], ['Dubai', 25.2, 55.27], ['Istanbul', 41.01, 28.98], ['Moscow', 55.76, 37.62],
    ['Cairo', 30.04, 31.24], ['Lagos', 6.52, 3.38], ['Nairobi', -1.29, 36.82], ['Johannesburg', -26.2, 28.05],
    ['Paris', 48.86, 2.35], ['London', 51.51, -0.13], ['Berlin', 52.52, 13.4], ['Madrid', 40.42, -3.7],
    ['Rome', 41.9, 12.5], ['Reykjavik', 64.15, -21.94], ['New York', 40.71, -74.01], ['Toronto', 43.65, -79.38],
    ['Los Angeles', 34.05, -118.24], ['Mexico City', 19.43, -99.13], ['Sao Paulo', -23.55, -46.63], ['Buenos Aires', -34.6, -58.38],
    ['Lima', -12.05, -77.04], ['Sydney', -33.87, 151.21], ['Auckland', -36.85, 174.76], ['Jakarta', -6.2, 106.85],
    ['Manila', 14.6, 120.98], ['Honolulu', 21.3, -157.86], ['Anchorage', 61.22, -149.9], ['Vancouver', 49.28, -123.12],
    ['Riyadh', 24.71, 46.68], ['Tehran', 35.69, 51.39], ['Santiago', -33.45, -70.67], ['Bogota', 4.71, -74.07],
  ].map(([name, lat, lon]) => ({ name, v: toVec(lat, lon), seoul: name === 'Seoul', hue: randHue(), ph: Math.random() * 6 }));
  const SEOUL = CITIES[0];

  function toVec(lat, lon) {
    const p = lat * DEG, l = lon * DEG;
    return [Math.cos(p) * Math.cos(l), Math.cos(p) * Math.sin(l), Math.sin(p)];
  }

  let W, H, R, cx, cy, dpr;
  let lon0 = -127 * DEG;
  const tilt = 22 * DEG;
  const arcs = [], blooms = [], motes = [], stars = [];

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    R = Math.min(W * 0.46, H * 0.44, 420);
    cx = W / 2;
    cy = Math.min(H * 0.42, 360);
    stars.length = 0;
    const n = Math.round(W * H / 9000);
    for (let i = 0; i < n; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.1 + 0.2, ph: Math.random() * 6, sp: 0.5 + Math.random() * 1.5 });
    motes.length = 0;
    for (let i = 0; i < 38; i++) motes.push(newMote(true));
  }

  // 반딧불처럼 떠오르는 빛 알갱이
  function newMote(anywhere) {
    return {
      x: Math.random() * W,
      y: anywhere ? Math.random() * H : H + 10,
      r: 1 + Math.random() * 2.4,
      vy: 0.08 + Math.random() * 0.22,
      sway: 0.3 + Math.random() * 0.8,
      ph: Math.random() * 6,
      hue: randHue(),
    };
  }

  function project(v, scale = 1) {
    const c = Math.cos(lon0), s = Math.sin(lon0);
    const x1 = v[0] * c + v[1] * s;
    const y1 = -v[0] * s + v[1] * c;
    const z1 = v[2];
    const d = x1 * Math.cos(tilt) + z1 * Math.sin(tilt);
    const up = -x1 * Math.sin(tilt) + z1 * Math.cos(tilt);
    return { x: cx + R * scale * y1, y: cy - R * scale * up, d };
  }

  function slerp(a, b, t) {
    const dot = Math.max(-1, Math.min(1, a[0] * b[0] + a[1] * b[1] + a[2] * b[2]));
    const om = Math.acos(dot);
    if (om < 1e-4) return a.slice();
    const sa = Math.sin((1 - t) * om) / Math.sin(om), sb = Math.sin(t * om) / Math.sin(om);
    return [a[0] * sa + b[0] * sb, a[1] * sa + b[1] * sb, a[2] * sa + b[2] * sb];
  }

  function spawnArc() {
    const a = Math.random() < 0.35 ? SEOUL : CITIES[(Math.random() * CITIES.length) | 0];
    const b = CITIES[(Math.random() * CITIES.length) | 0];
    if (a === b) return;
    arcs.push({ a: a.v, b: b.v, t0: performance.now(), dur: 2600 + Math.random() * 1800, hue: randHue() });
  }

  function birth() {
    const c = CITIES[(Math.random() * CITIES.length) | 0];
    const pick = project(c.v).d > 0.1 ? c : CITIES.find(x => project(x.v).d > 0.2) || c;
    blooms.push({ v: pick.v, t0: performance.now(), hue: randHue(), rot: Math.random() * Math.PI });
    if (blooms.length > 60) blooms.shift();
  }

  function path(points) {
    ctx.beginPath();
    let pen = false;
    for (const p of points) {
      if (p.d > 0) { pen ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); pen = true; }
      else pen = false;
    }
  }

  function glowDot(x, y, r, h, a) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * 4);
    g.addColorStop(0, hsl(h, 100, 85, a));
    g.addColorStop(0.3, hsl(h, 95, 70, a * 0.5));
    g.addColorStop(1, hsl(h, 90, 60, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r * 4, 0, Math.PI * 2); ctx.fill();
  }

  function draw(now) {
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';

    // 별
    for (const s of stars) {
      const a = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(now / 1000 * s.sp + s.ph));
      ctx.fillStyle = `rgba(255,248,240,${a})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }

    // 대기의 빛무리 (색이 천천히 변함)
    const hA = (now / 120) % 360;
    const halo = ctx.createRadialGradient(cx, cy, R * 0.9, cx, cy, R * 1.35);
    halo.addColorStop(0, hsl(hA, 90, 75, 0.28));
    halo.addColorStop(0.5, hsl((hA + 60) % 360, 90, 70, 0.1));
    halo.addColorStop(1, hsl((hA + 120) % 360, 90, 70, 0));
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(cx, cy, R * 1.35, 0, Math.PI * 2); ctx.fill();

    // 구 본체: 밤바다 같은 그라데이션
    const body = ctx.createRadialGradient(cx - R * 0.35, cy - R * 0.4, R * 0.05, cx, cy, R);
    body.addColorStop(0, 'rgba(120, 90, 200, 0.45)');
    body.addColorStop(0.6, 'rgba(40, 30, 100, 0.35)');
    body.addColorStop(1, 'rgba(20, 15, 60, 0.25)');
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();

    // 무지갯빛 테두리
    ctx.lineWidth = 1.2;
    const rim = ctx.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
    rim.addColorStop(0, hsl(28, 100, 80, 0.7));
    rim.addColorStop(0.35, hsl(345, 100, 78, 0.7));
    rim.addColorStop(0.7, hsl(270, 100, 80, 0.7));
    rim.addColorStop(1, hsl(175, 80, 75, 0.7));
    ctx.strokeStyle = rim;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();

    // 궤도 고리
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-0.35);
    ctx.setLineDash([2, 7]);
    ctx.lineDashOffset = -now / 60;
    ctx.strokeStyle = hsl((hA + 180) % 360, 90, 80, 0.25);
    ctx.beginPath(); ctx.ellipse(0, 0, R * 1.22, R * 0.32, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    // 위선 · 경선 (부드러운 라일락빛)
    ctx.lineWidth = 0.7;
    for (let lat = -60; lat <= 60; lat += 20) {
      const pts = [];
      for (let lon = 0; lon <= 360; lon += 5) pts.push(project(toVec(lat, lon)));
      ctx.strokeStyle = lat === 0 ? 'rgba(255, 207, 158, 0.4)' : 'rgba(210, 190, 255, 0.18)';
      path(pts); ctx.stroke();
    }
    for (let lon = 0; lon < 360; lon += 20) {
      const pts = [];
      for (let lat = -90; lat <= 90; lat += 5) pts.push(project(toVec(lat, lon)));
      ctx.strokeStyle = 'rgba(210, 190, 255, 0.16)';
      path(pts); ctx.stroke();
    }

    ctx.globalCompositeOperation = 'lighter';

    // 무지갯빛 항로
    for (let i = arcs.length - 1; i >= 0; i--) {
      const A = arcs[i];
      const p = (now - A.t0) / A.dur;
      if (p > 1.4) { arcs.splice(i, 1); continue; }
      const head = Math.min(p, 1);
      const tail = Math.max(0, p - 0.5);
      const fade = p > 1 ? 1 - (p - 1) / 0.4 : 1;
      const pts = [];
      for (let k = 0; k <= 40; k++) {
        const t = tail + (head - tail) * (k / 40);
        pts.push(project(slerp(A.a, A.b, t), 1 + 0.14 * Math.sin(Math.PI * t)));
      }
      ctx.lineWidth = 1.6;
      ctx.strokeStyle = hsl(A.hue, 100, 75, 0.6 * fade);
      path(pts); ctx.stroke();
      const hp = pts[pts.length - 1];
      if (hp.d > 0 && p < 1) glowDot(hp.x, hp.y, 2, A.hue, 0.9 * fade);
    }

    // 도시 불빛
    for (const c of CITIES) {
      const p = project(c.v);
      if (p.d <= 0) continue;
      const tw = 0.55 + 0.45 * Math.sin(now / 700 + c.ph);
      if (c.seoul) {
        glowDot(p.x, p.y, 3, 345, 0.9 * p.d);
        ctx.strokeStyle = hsl(345, 100, 80, 0.35 * p.d);
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(p.x, p.y, 9 + 3 * Math.sin(now / 500), 0, Math.PI * 2); ctx.stroke();
      } else {
        glowDot(p.x, p.y, 1.7, c.hue, (0.3 + 0.6 * p.d) * tw);
      }
    }

    // 탄생: 꽃처럼 피어나는 빛
    for (let i = blooms.length - 1; i >= 0; i--) {
      const B = blooms[i];
      const p = (now - B.t0) / 2200;
      if (p > 1) { blooms.splice(i, 1); continue; }
      const pt = project(B.v);
      if (pt.d <= 0) continue;
      const ease = 1 - Math.pow(1 - p, 3);
      const a = (1 - p) * 0.85;
      const size = 4 + ease * 14;
      ctx.save();
      ctx.translate(pt.x, pt.y);
      ctx.rotate(B.rot + ease * 0.8);
      for (let k = 0; k < 6; k++) {
        ctx.rotate(Math.PI / 3);
        ctx.fillStyle = hsl((B.hue + k * 12) % 360, 100, 75, a * 0.55);
        ctx.beginPath();
        ctx.ellipse(size * 0.55, 0, size * 0.5, size * 0.2, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
      glowDot(pt.x, pt.y, 1.6, B.hue, a);
    }

    // 떠오르는 빛 알갱이
    for (let i = 0; i < motes.length; i++) {
      const m = motes[i];
      m.y -= m.vy * (running ? 1.8 : 1);
      const x = m.x + Math.sin(now / 1500 + m.ph) * 18 * m.sway;
      if (m.y < -10) { motes[i] = newMote(false); continue; }
      glowDot(x, m.y, m.r, m.hue, 0.35 + 0.3 * Math.sin(now / 600 + m.ph));
    }

    ctx.globalCompositeOperation = 'source-over';
  }

  let last = performance.now(), nextArc = 0;
  function loop(now) {
    const dt = Math.min(now - last, 100);
    last = now;
    lon0 += dt * 0.000045 * (running ? 2.2 : 1);
    if (now > nextArc) {
      spawnArc();
      nextArc = now + (running ? 450 : 1000) + Math.random() * 700;
    }
    draw(now);
    requestAnimationFrame(loop);
  }

  resize();
  addEventListener('resize', resize);
  if (reduceMotion) draw(performance.now());
  else requestAnimationFrame(loop);

  return { birth };
})();

/* ═════════════ 언어 적용 ═════════════ */
const langBtn = $('lang');

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = T()[el.dataset.i18n]; });
  langBtn.querySelectorAll('span').forEach(s => s.classList.toggle('on', s.dataset.l === lang));
  for (const f of FACTS) {
    const [unit, label] = T().facts[f.id];
    f.unitEl.textContent = unit;
    f.labelEl.textContent = label;
    f.last = '';
  }
  lastQuip = '';
  showEditorial();
  updateButtons();
  renderLaps();
  render();
}

langBtn.addEventListener('click', e => {
  const picked = e.target.closest('[data-l]');
  const order = Object.keys(I18N);
  lang = picked ? picked.dataset.l : order[(order.indexOf(lang) + 1) % order.length];
  try { localStorage.setItem('meanwhile-lang', lang); } catch (e) {}
  applyLang();
  langBtn.blur();
});

applyLang();
</script>
